version: '3.8'

services:
  db:
    image: postgis/postgis:16-3.4
    container_name: jeevika_postgres
    restart: always
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres_password
      POSTGRES_DB: jeevika_db
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d jeevika_db"]
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7.2-alpine
    container_name: jeevika_redis
    restart: always
    ports:
      - "6379:6379"
    volumes:
      - redisdata:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5

  api:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: jeevika_api
    restart: always
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    ports:
      - "8000:8000"
    environment:
      - DATABASE_URL=postgresql+psycopg2://postgres:postgres_password@db:5432/jeevika_db
      - ASYNC_DATABASE_URL=postgresql+asyncpg://postgres:postgres_password@db:5432/jeevika_db
      - REDIS_URL=redis://redis:6379/0
      - SECRET_KEY=jeevika-saarthi-super-secret-jwt-key-change-in-production
    volumes:
      - ./app:/app/app

volumes:
  pgdata:
  redisdata:
